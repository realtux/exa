services:
    app:
        container_name: exa_app
        image: node:24
        tty: true
        ports:
            - "8118:8118"
        volumes:
            - .:/opt/src
        working_dir: /opt/src
        command: >
            bash -c '
            if [ "$EXAENV" = "development" ]; then
                npm i; npm run watch
            else
                npm i; npx --yes jmig migrate; npm start
            fi'
        env_file:
            - .env
    console:
        container_name: exa_console
        image: node:24
        tty: true
        init: true
        volumes:
            - .:/opt/src
        working_dir: /opt/src
        env_file:
            - .env
        profiles:
            - nostart
